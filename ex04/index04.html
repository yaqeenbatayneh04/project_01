<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04</title>
</head>
<body>
    <h1>User Registration Form</h1>

    <form action="#" method="POST">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required minlength="3">

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="8">

        <p>Experience Level:</p>
        <input type="radio" id="beginner" name="experience" value="beginner" checked>
        <label for="beginner">Beginner</label>

        <input type="radio" id="intermediate" name="experience" value="intermediate">
        <label for="intermediate">Intermediate</label>

        <input type="radio" id="advanced" name="experience" value="advanced">
        <label for="advanced">Advanced</label>

        <p>
            <label for="track">Preferred Track:</label>
            <select id="track" name="track" required>
                <option value="">--Please choose an option--</option>
                <option value="cybersecurity">Cybersecurity</option>
                <option value="web">Web Development</option>
            </select>
        </p>

        <p>
            <label for="bio">Short Bio / Comments:</label><br>
            <textarea id="bio" name="bio" rows="4" cols="30"></textarea>
        </p>

        <p>
            <input type="checkbox" id="agreement" name="agreement" required>
            <label for="agreement">I agree to the terms and conditions</label>
        </p>

        <button type="submit">Register</button>
    </form>
</body>
</html>
